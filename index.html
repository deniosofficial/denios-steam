<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b57d0">
<link rel="manifest" href="manifest.json">
<title>DENIOS STEAM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#0b57d0;color:#fff;padding:20px;border-radius:0 0 20px 20px}
h1{margin:0 0 5px;font-size:25px}.sub{opacity:.9}
main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.balance{font-size:30px;font-weight:bold;margin-top:8px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:bold;cursor:pointer}
.in{background:#dff7e7;color:#137333}.out{background:#ffe4e4;color:#b3261e}.primary{background:#0b57d0;color:#fff}.danger{background:#b3261e;color:#fff}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}
.item{border-top:1px solid #eee;padding:12px 0}.muted{color:#777;font-size:13px}
.amount.income{color:#137333;font-weight:bold}.amount.expense{color:#b3261e;font-weight:bold}
.actions{display:flex;gap:7px;margin-top:8px}.actions button{padding:8px 10px;font-size:12px}
</style>
</head>
<body>
<header><h1>DENIOS STEAM</h1><div class="sub">Pencatatan keuangan usaha</div></header>
<main>
<div class="card"><div>Saldo</div><div class="balance" id="balance">Rp0</div></div>

<div class="card">
<h3>Tambah Transaksi</h3>
<select id="type"><option value="in">Uang Masuk</option><option value="out">Uang Keluar</option></select>
<input id="desc" placeholder="Keterangan">
<input id="amount" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
<button class="primary" onclick="saveTransaction()">Simpan</button>
</div>

<div class="card">
<h3>Riwayat Transaksi</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Laporan Bulan Ini</h3>
<div id="report"></div>
</div>
</main>

<script>
const KEY='denios_steam_transactions';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
let editId=null;
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
}
function saveTransaction(){
 const type=document.getElementById('type').value;
 const desc=document.getElementById('desc').value.trim();
 const amount=Number(document.getElementById('amount').value);
 if(!desc||!amount||amount<0){alert('Isi keterangan dan jumlah dengan benar.');return;}
 if(editId){
  const x=data.find(t=>t.id===editId);
  x.type=type;x.desc=desc;x.amount=amount;
  editId=null;
 }else{
  data.unshift({id:Date.now(),type,desc,amount,date:new Date().toISOString()});
 }
 document.getElementById('desc').value='';
 document.getElementById('amount').value='';
 save();
}
function editTx(id){
 const x=data.find(t=>t.id===id); if(!x)return;
 document.getElementById('type').value=x.type;
 document.getElementById('desc').value=x.desc;
 document.getElementById('amount').value=x.amount;
 editId=id;
 window.scrollTo({top:0,behavior:'smooth'});
}
function delTx(id){
 if(confirm('Hapus transaksi ini?')){data=data.filter(t=>t.id!==id);save();}
}
function render(){
 let bal=0, tin=0,tout=0;
 data.forEach(t=>{if(t.type==='in'){bal+=t.amount;tin+=t.amount}else{bal-=t.amount;tout+=t.amount}});
 document.getElementById('balance').textContent=rupiah(bal);
 const list=document.getElementById('list');
 if(!data.length){list.innerHTML='<div class="muted">Belum ada transaksi.</div>'}
 else list.innerHTML=data.map(t=>`
 <div class="item">
  <div><b>${escapeHtml(t.desc)}</b></div>
  <div class="muted">${new Date(t.date).toLocaleString('id-ID')}</div>
  <div class="amount ${t.type==='in'?'income':'expense'}">${t.type==='in'?'+':'-'} ${rupiah(t.amount)}</div>
  <div class="actions"><button onclick="editTx(${t.id})">Edit</button><button class="danger" onclick="delTx(${t.id})">Hapus</button></div>
 </div>`).join('');
 const now=new Date(),m=now.getMonth(),y=now.getFullYear();
 const month=data.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y});
 const mi=month.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
 const mo=month.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
 document.getElementById('report').innerHTML=`<div>Uang masuk: <b>${rupiah(mi)}</b></div><div>Uang keluar: <b>${rupiah(mo)}</b></div><div>Selisih: <b>${rupiah(mi-mo)}</b></div>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
